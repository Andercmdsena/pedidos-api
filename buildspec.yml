# AWS CodeBuild - Plataforma de Gestión de Pedidos
# Imagen recomendada: aws/codebuild/amazonlinux-x86_64-standard:5.0 (trae .NET 8)
version: 0.2

env:
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"

phases:
  install:
    runtime-versions:
      dotnet: 8.0
  pre_build:
    commands:
      - echo "Restaurando dependencias..."
      - dotnet restore src/Pedidos.Api/Pedidos.Api.csproj
      - dotnet restore tests/Pedidos.Api.Tests/Pedidos.Api.Tests.csproj
  build:
    commands:
      - echo "Compilando..."
      - dotnet build src/Pedidos.Api/Pedidos.Api.csproj -c Release --no-restore
      - echo "Ejecutando pruebas unitarias..."
      - dotnet test tests/Pedidos.Api.Tests/Pedidos.Api.Tests.csproj -c Release --logger "trx;LogFileName=resultados.trx" --results-directory ./test-results
  post_build:
    commands:
      - echo "Publicando paquete para AWS Lambda..."
      - dotnet publish src/Pedidos.Api/Pedidos.Api.csproj -c Release -r linux-x64 --self-contained false -o ./publish

reports:
  pruebas-unitarias:
    files:
      - "**/*.trx"
    base-directory: test-results
    file-format: VisualStudioTrx

artifacts:
  files:
    - "**/*"
  base-directory: publish

cache:
  paths:
    - "/root/.nuget/packages/**/*"
